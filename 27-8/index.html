<!DOCTYPE html>
<html lang="es">

<head>

    <!-- Define los caracteres que puede utilizar la página -->
    <meta charset="UTF-8">

    <!-- Hace que la página se adapte a celulares, tablets y PC -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Título que aparece en la pestaña -->
    <title>Mis juegos favoritos</title>

    <!-- Conecta nuestro HTML con el archivo CSS -->
    <link rel="stylesheet" href="estilos.css">

</head>


<body>

    <!-- ================================= -->
    <!-- VIDEO DE FONDO -->
    <!-- ================================= -->

    <video autoplay muted loop id="fondo">

        <source
            src="38d9dc3350_cozy-lofi-relaxing-rainy-day-aesthetic.mp4"
            type="video/mp4">

    </video>


    <!-- ================================= -->
    <!-- TÍTULO PRINCIPAL -->
    <!-- ================================= -->

    <h1>🎮 Mis juegos favoritos</h1>


    <!-- Pequeña introducción -->

    <p>Estos son algunos de mis juegos favoritos:</p>


    <!-- ================================= -->
    <!-- LISTA DE JUEGOS -->
    <!-- ================================= -->

    <ul>


        <!-- VALORANT -->

        <li>

            <a
                class="valorant"
                href="https://playvalorant.com/"
                target="_blank">
            </a>

        </li>


        <!-- HOGWARTS LEGACY -->

        <li>

            <a
                class="hogwarts"
                href="https://store.steampowered.com/app/990080/Hogwarts_Legacy/"
                target="_blank">
            </a>

        </li>


        <!-- COUNTER STRIKE 2 -->

        <li>

            <a
                class="counterstrike"
                href="https://store.steampowered.com/app/730/CounterStrike_2/"
                target="_blank">
            </a>

        </li>


        <!-- SMITE 2 -->

        <li>

            <a
                class="smite"
                href="https://store.steampowered.com/app/2437170/SMITE_2/"
                target="_blank">
            </a>

        </li>


    </ul>



    <!-- ================================= -->
    <!-- VIDEOS / GAMING HIGHLIGHTS -->
    <!-- ================================= -->

    <div class="videos">


        <!-- VIDEO 1 -->

        <video controls>

            <source
                src="ipront.mp4"
                type="video/mp4">

        </video>


        <!-- VIDEO 2 -->

        <video controls>

            <source
                src="21K.mp4"
                type="video/mp4">

        </video>


        <!-- VIDEO 3 -->

        <video controls>

            <source
                src="Montage2.mp4"
                type="video/mp4">

        </video>


        <!-- VIDEO 4 -->

        <video controls>

            <source
                src="REAL GOTY.mp4"
                type="video/mp4">

        </video>


    </div>


</body>

</html>
<!-- ================================================== -->

     Agrega una descripción de la página.

<!-- 4. <meta name="viewport">
     Hace que la página se adapte correctamente
     a celulares, tablets y computadoras. -->

<!-- 5. <link rel="stylesheet">
     Conecta nuestro archivo HTML con un archivo CSS
     para darle estilos y diseño a la página. -->

<!-- 6. <link rel="icon">
     Define el pequeño ícono que aparece en la pestaña
     del navegador junto al título de la página. -->

<!-- 7. <style>
     Permite escribir código CSS directamente
     dentro del archivo HTML. -->

<!-- 8. <script>
     Permite incorporar JavaScript a nuestra página
     para agregar funcionalidades e interactividad. -->

<!-- 9. <base>
     Define una URL base para los enlaces relativos
     utilizados dentro de la página. -->

<!-- 10. <meta name="robots">
      Indica a los buscadores cómo deben tratar
      nuestra página al momento de indexarla. -->
